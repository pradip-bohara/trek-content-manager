<style>
    @import url("https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap");

    :root {
        --yeti-green: #022f2e;
        --yeti-gold: #b59a53;
        --yeti-white: #ffffff;
        --yeti-dark: #171714;
        --yeti-header-height: 126px;
        --yeti-scrolled-height: 88px;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    #yetiHeader,
    #yetiHeader * {
        box-sizing: border-box;
    }

    .yeti-widget-zero-space {
        height: 0 !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* HEADER */
    .yeti-header {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 999999;
        width: 100%;
        height: var(--yeti-header-height);
        background: transparent;
        transition:
            height 0.4s cubic-bezier(.22, 1, .36, 1),
            background-color 0.35s ease,
            border-color 0.35s ease,
            box-shadow 0.35s ease;
    }

    body.admin-bar .yeti-header {
        top: 32px;
    }

    /*
  Equal left and right columns keep the centre logo exactly
  centred in the browser window regardless of menu width.
*/
    .yeti-header__inner {
        position: relative;
        width: 100%;
        max-width: 1920px;
        height: 100%;
        margin: 0 auto;
        padding: 0 clamp(28px, 4vw, 82px);
        display: grid;
        grid-template-columns:
            minmax(0, 1fr) clamp(240px, 20vw, 360px) minmax(0, 1fr);
        align-items: center;
        column-gap: clamp(25px, 3vw, 60px);
    }

    /* NAVIGATION */
    .yeti-nav {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: clamp(22px, 2.4vw, 46px);
    }

    .yeti-nav--left {
        justify-content: flex-end;
    }

    .yeti-nav--right {
        justify-content: flex-start;
    }

    .yeti-nav a {
        position: relative;
        display: block;
        padding: 12px 0;
        color: var(--yeti-white);
        font-family: "Open Sans", Arial, sans-serif;
        font-size: clamp(13px, 0.9vw, 16px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        text-decoration: none;
        white-space: nowrap;
        transition:
            color 0.3s ease,
            transform 0.3s ease;
    }

    .yeti-nav a::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 2px;
        width: 0;
        height: 1px;
        background: var(--yeti-gold);
        transform: translateX(-50%);
        transition: width 0.35s cubic-bezier(.22, 1, .36, 1);
    }

    .yeti-nav a:hover,
    .yeti-nav a.is-active {
        color: var(--yeti-gold);
        transform: translateY(-1px);
    }

    .yeti-nav a:hover::before,
    .yeti-nav a.is-active::before {
        width: 100%;
    }

    /* SEARCH ICON */
    .yeti-search {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        display: flex !important;
        align-items: center;
        justify-content: center;
        padding: 0 !important;
        color: var(--yeti-white);
        border: 1px solid rgba(255, 255, 255, 0.52);
        border-radius: 50%;
        transition:
            color 0.3s ease,
            border-color 0.3s ease,
            background-color 0.3s ease,
            transform 0.3s ease !important;
    }

    .yeti-search::before {
        display: none !important;
    }

    .yeti-search svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .yeti-search:hover {
        color: var(--yeti-gold) !important;
        border-color: var(--yeti-gold);
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px) scale(1.04) !important;
    }

    /* HORIZONTAL LOGO */
    .yeti-logo {
        position: relative;
        z-index: 5;
        width: 100%;
        height: 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        line-height: 0;
        text-decoration: none;
    }

    .yeti-logo img {
        display: block;
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 88px;
        object-fit: contain;
        object-position: center;
        transform: translate(-1px, 1px) scale(1.4);
        transform-origin: center;
        transition:
            max-height 0.4s cubic-bezier(.22, 1, .36, 1),
            opacity 0.3s ease,
            transform 0.3s ease;
    }

    .yeti-logo:hover img {
        transform: translate(-1px, 1px) scale(1.43);
    }

    /* WHITE HEADER ONLY AFTER SCROLL */
    .yeti-header.is-scrolled {
        height: var(--yeti-scrolled-height);
        background: rgba(255, 255, 255, 0.98);
        border-bottom-color: rgba(2, 47, 46, 0.1);
        box-shadow: 0 8px 32px rgba(25, 30, 27, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .yeti-header.is-scrolled .yeti-nav a {
        color: var(--yeti-dark);
    }

    .yeti-header.is-scrolled .yeti-nav a:hover,
    .yeti-header.is-scrolled .yeti-nav a.is-active {
        color: var(--yeti-gold);
    }

    .yeti-header.is-scrolled .yeti-search {
        color: var(--yeti-green);
        border-color: rgba(2, 47, 46, 0.3);
        background: transparent;
    }

    .yeti-header.is-scrolled .yeti-search:hover {
        color: var(--yeti-gold) !important;
        border-color: var(--yeti-gold);
        background: rgba(181, 154, 83, 0.08);
    }

    .yeti-header.is-scrolled .yeti-logo img {
        max-height: 64px;
    }

    /* MOBILE CONTROLS & HAMBURGER BUTTON */
    .yeti-header-actions {
        display: none;
    }

    .yeti-menu-button {
        display: none;
        position: relative;
        z-index: 10;
        width: 44px;
        height: 44px;
        padding: 9px;
        border: 0 !important;
        outline: none !important;
        box-shadow: none !important;
        background: transparent !important;
        background-color: transparent !important;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .yeti-menu-button:focus,
    .yeti-menu-button:active,
    .yeti-menu-button:hover {
        background: transparent !important;
        background-color: transparent !important;
        border: 0 !important;
        outline: none !important;
        box-shadow: none !important;
    }

    .yeti-menu-button span {
        display: block;
        width: 100%;
        height: 1.5px;
        margin: 6px 0;
        background: var(--yeti-white);
        pointer-events: none;
        transition:
            transform 0.3s ease,
            opacity 0.3s ease,
            background-color 0.3s ease;
    }

    .yeti-header.is-scrolled .yeti-menu-button span,
    .yeti-header.menu-open .yeti-menu-button span {
        background: var(--yeti-green);
    }

    .yeti-header.menu-open .yeti-menu-button span:nth-child(1) {
        transform: translateY(7.5px) rotate(45deg);
    }

    .yeti-header.menu-open .yeti-menu-button span:nth-child(2) {
        opacity: 0;
    }

    .yeti-header.menu-open .yeti-menu-button span:nth-child(3) {
        transform: translateY(-7.5px) rotate(-45deg);
    }

    .yeti-mobile-nav {
        display: none;
    }

    /* SMALLER DESKTOP */
    @media (max-width: 1240px) {
        .yeti-header__inner {
            padding-inline: 25px;
            grid-template-columns:
                minmax(0, 1fr) 240px minmax(0, 1fr);
            column-gap: 24px;
        }

        .yeti-nav {
            gap: 16px;
        }

        .yeti-nav a {
            font-size: 12px;
            letter-spacing: 0.055em;
        }

        .yeti-logo img {
            max-height: 70px;
        }

        .yeti-header.is-scrolled .yeti-logo img {
            max-height: 56px;
        }
    }

    /* TABLET AND MOBILE */
    @media (max-width: 920px) {
        :root {
            --yeti-header-height: 92px;
            --yeti-scrolled-height: 78px;
        }

        .yeti-header__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
        }

        .yeti-nav {
            display: none;
        }

        .yeti-logo {
            width: min(200px, 50vw);
            height: 100%;
            margin: 0;
            flex-shrink: 0;
        }

        .yeti-logo img {
            width: 100%;
            max-height: 58px;
        }

        .yeti-header.is-scrolled .yeti-logo img {
            max-height: 54px;
        }

        /* ACTIONS ON RIGHT: SEARCH ICON + HAMBURGER */
        .yeti-header-actions {
            position: static;
            transform: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            flex-shrink: 0;
        }

        .yeti-menu-button {
            display: block;
        }

        .yeti-search--mobile {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            display: flex !important;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--yeti-white);
            background: transparent;
            text-decoration: none;
            transition:
                color 0.3s ease,
                border-color 0.3s ease,
                background-color 0.3s ease,
                transform 0.3s ease;
        }

        .yeti-search--mobile svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .yeti-search--mobile:hover,
        .yeti-search--mobile:focus {
            color: var(--yeti-gold);
            border-color: var(--yeti-gold);
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .yeti-header.is-scrolled .yeti-search--mobile,
        .yeti-header.menu-open .yeti-search--mobile {
            color: var(--yeti-green);
            border-color: rgba(2, 47, 46, 0.3);
            background: transparent;
        }

        .yeti-header.is-scrolled .yeti-search--mobile:hover,
        .yeti-header.menu-open .yeti-search--mobile:hover {
            color: var(--yeti-gold);
            border-color: var(--yeti-gold);
            background: rgba(181, 154, 83, 0.08);
        }

        .yeti-mobile-nav {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            max-height: 0;
            padding: 0 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.99);
            border-top: 1px solid rgba(2, 47, 46, 0.08);
            box-shadow: 0 22px 35px rgba(0, 0, 0, 0.1);
            opacity: 0;
            visibility: hidden;
            transition:
                max-height 0.4s ease,
                padding 0.4s ease,
                opacity 0.3s ease,
                visibility 0.3s ease;
        }

        .yeti-header.menu-open {
            background: #ffffff;
        }

        .yeti-header.menu-open .yeti-mobile-nav {
            max-height: 520px;
            padding-top: 20px;
            padding-bottom: 28px;
            opacity: 1;
            visibility: visible;
        }

        .yeti-mobile-nav a {
            width: 100%;
            max-width: 430px;
            padding: 17px 10px;
            border-bottom: 1px solid rgba(2, 47, 46, 0.1);
            color: var(--yeti-dark);
            font-family: "Open Sans", Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-align: center;
            text-transform: uppercase;
            text-decoration: none;
        }

        .yeti-mobile-nav a:last-child {
            border-bottom: 0;
        }

        .yeti-mobile-nav a:hover,
        .yeti-mobile-nav a.is-active {
            color: var(--yeti-gold);
        }
    }

    @media (max-width: 782px) {
        body.admin-bar .yeti-header {
            top: 46px;
        }
    }

    @media (max-width: 480px) {
        .yeti-header__inner {
            padding: 0 14px;
        }

        .yeti-logo {
            width: min(160px, 48vw);
        }

        .yeti-logo img {
            max-height: 54px;
        }

        .yeti-header.is-scrolled .yeti-logo img {
            max-height: 46px;
        }

        .yeti-header-actions {
            gap: 6px;
        }
    }
</style>

<script>
    (() => {
        const header = document.getElementById("yetiHeader");
        if (!header) return;

        const menuButton = header.querySelector(".yeti-menu-button");
        const links = header.querySelectorAll("a[href]");
        const widget = header.closest(".elementor-widget-html");

        if (widget) {
            widget.classList.add("yeti-widget-zero-space");
        }

        const cleanPath = path => {
            const cleaned = path.replace(/\/+$/, "");
            return cleaned || "/";
        };

        const currentPath = cleanPath(window.location.pathname);

        /* Every page starts transparent and turns white only after scrolling. */
        const updateHeader = () => {
            header.classList.toggle("is-scrolled", window.scrollY > 40);
        };

        updateHeader();

        window.addEventListener("scroll", updateHeader, {
            passive: true
        });

        /* Current page highlight */
        links.forEach(link => {
            const linkPath = cleanPath(
                new URL(link.href, window.location.origin).pathname
            );

            if (linkPath === currentPath) {
                link.classList.add("is-active");
            }
        });

        /* Mobile navigation */
        menuButton?.addEventListener("click", () => {
            const open = header.classList.toggle("menu-open");

            menuButton.setAttribute("aria-expanded", String(open));
            menuButton.setAttribute(
                "aria-label",
                open ? "Close navigation" : "Open navigation"
            );
        });

        links.forEach(link => {
            link.addEventListener("click", () => {
                header.classList.remove("menu-open");
                menuButton?.setAttribute("aria-expanded", "false");
            });
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                header.classList.remove("menu-open");
                menuButton?.setAttribute("aria-expanded", "false");
            }
        });

        window.addEventListener("resize", () => {
            if (window.innerWidth > 920) {
                header.classList.remove("menu-open");
                menuButton?.setAttribute("aria-expanded", "false");
            }
        });
    })();
</script>
